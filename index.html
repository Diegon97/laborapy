                "name": "¿Cómo se calcula la indemnización por despido injustificado en Paraguay?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Conforme al Art. 91 del Código del Trabajo de Paraguay (Ley N.º 213/93), la indemnización equivale a quince (15) salarios diarios por cada año de servicio o fracción superior a seis (6) meses. La base salarial diaria se obtiene del promedio mensual de remuneraciones de los últimos seis meses dividido entre 30 (Art. 92 inc. B)."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cuántos días de preaviso corresponden según la antigüedad laboral?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Según el Art. 87 de la Ley 213/93: hasta 1 año corresponden 30 días; más de 1 y hasta 5 años, 45 días; más de 5 y hasta 10 años, 60 días; y más de 10 años de antigüedad en adelante, 90 días."
                }
              },
              {
                "@type": "Question",
                "name": "¿El aguinaldo proporcional paga aporte al IPS en Paraguay?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. El Art. 76 del Decreto-Ley N.º 1860/50 del IPS excluye expresamente al aguinaldo de la base imponible ('exceptuando los aguinaldos'). Por tanto, el aguinaldo proporcional se liquida libre de descuentos previsionales."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué ocurre si el trabajador renuncia sin otorgar el preaviso?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "De acuerdo con el Art. 90 (segundo párrafo) de la Ley N.º 213/93, si el trabajador omite el preaviso en su renuncia, el empleador puede descontar de su liquidación una cantidad equivalente a la mitad (50%) del salario correspondiente al término del preaviso."
                }
              },

                "@type": "Question",
                "name": "¿Cómo se calculan las vacaciones anuales y proporcionales?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "El Art. 218 establece: 12 días corridos hasta 5 años de antigüedad; 18 días entre 5 y 10 años; y 30 días para más de 10 años. Las vacaciones proporcionales aplican ante despido sin causa imputable al empleador (Art. 221)."

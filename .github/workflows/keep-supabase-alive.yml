name: Keep Supabase Project Alive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase REST (/rest/v1/)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validar secretos requeridos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltan secretos SUPABASE_URL o SUPABASE_ANON_KEY en GitHub Secrets"
            exit 1
          fi

      - name: Ping liviano a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          CLEAN_URL="$(printf '%s' "${SUPABASE_URL}" | tr -d '[:space:]' | sed 's:/*$::')"
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
            --retry 3 --retry-delay 5 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${CLEAN_URL}/rest/v1/")
          CURL_EXIT=$?
          echo "Status: ${HTTP_STATUS} (curl exit: ${CURL_EXIT})"
          if [ "${CURL_EXIT}" -ne 0 ] || [ "${HTTP_STATUS}" = "000" ] || [ "${HTTP_STATUS}" -ge 500 ]; then
            echo "::error::Fallo ping a Supabase (HTTP ${HTTP_STATUS}, exit code ${CURL_EXIT})"
            exit 1
          fi
